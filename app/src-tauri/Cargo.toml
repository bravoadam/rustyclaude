[package]
name = "rustyclaude-app"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
dirs = "7.0.0"
futures-util = "0.3.34"
rustyclaude-protocol = { version = "0.1.0", path = "../../crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "=3.0.0-alpha.6", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-autostart = "=3.0.0-alpha.3"
tauri-plugin-global-shortcut = "=3.0.0-alpha.3"
tauri-plugin-notification = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-single-instance = "=3.0.0-alpha.3"
tauri-plugin-window-state = "=3.0.0-alpha.2"
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.11", package = "gtk4" }
tauri-runtime-cef = "=3.0.0-alpha.7"
# Same version as tauri-runtime-cef uses, for its Browser type.
cef = "=154.5.0"
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-runtime-wry = "=3.0.0-alpha.6"
