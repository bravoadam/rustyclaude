[package]
name = "rustyclaude-app"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures-util = "0.3.34"
rustyclaude-protocol = { version = "0.1.0", path = "../../crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
